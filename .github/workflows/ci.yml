name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger of the workflow

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  PROJECT: HackGpon.MA5671A.Eeprom.Avalonia/HackGpon.MA5671A.Eeprom.Avalonia.csproj
  ASSEMBLY: HackGpon.MA5671A.Eeprom.Avalonia
  APP_NAME: MA5671A-Eeprom

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_exists: ${{ steps.resolve.outputs.tag_exists }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read version from csproj
        id: resolve
        shell: bash
        run: |
          VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' "$PROJECT" | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error file=$PROJECT::No tag <Version> found"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v$VERSION already present - skip"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "### Version \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Build Windows (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Publish (self-contained single file)
        shell: bash
        run: |
          dotnet publish "$PROJECT" \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:Version=$VERSION \
            -p:ContinuousIntegrationBuild=true \
            -o "artifacts/${{ matrix.rid }}"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "artifacts/${{ matrix.rid }}/$env:ASSEMBLY.exe" "package/$env:APP_NAME.exe"
          Copy-Item README.md, LICENSE.txt package/
          Compress-Archive -Path package/* -DestinationPath "$env:APP_NAME-$env:VERSION-${{ matrix.rid }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.rid }}
          path: '*.zip'
          if-no-files-found: error

  build-unix:
    name: Build ${{ matrix.name }} (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            name: Linux
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            name: Linux
          - rid: osx-x64
            os: macos-latest
            name: macOS
          - rid: osx-arm64
            os: macos-latest
            name: macOS
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Publish (self-contained single file)
        run: |
          dotnet publish "$PROJECT" \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:Version=$VERSION \
            -p:ContinuousIntegrationBuild=true \
            -o "artifacts/${{ matrix.rid }}"

      - name: Package
        run: |
          mkdir -p package
          cp "artifacts/${{ matrix.rid }}/$ASSEMBLY" "package/$APP_NAME"
          cp README.md LICENSE.txt package/
          chmod +x "package/$APP_NAME"
          tar -C package -czf "${APP_NAME}-${VERSION}-${{ matrix.rid }}.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.rid }}
          path: '*.tar.gz'
          if-no-files-found: error

  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    needs: [version, build-windows, build-unix]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      statuses: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect release assets
        run: |
          mkdir -p release
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp {} release/ \;
          ls -lh release

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release/*.zip, release/*.tar.gz'

      - name: Tag release
        id: tag
        if: needs.version.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        id: gh_release
        if: steps.tag.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: release/*

      - name: Report release status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.version.outputs.tag_exists }}" = "true" ]; then
            STATE=pending
            DESCRIPTION="Version v$VERSION already released - bump <Version> in $ASSEMBLY.csproj."
          elif [ "${{ steps.gh_release.outcome }}" = "success" ]; then
            STATE=success
            DESCRIPTION="Released v$VERSION with Windows, Linux and macOS artifacts."
          else
            STATE=failure
            DESCRIPTION="Release failed with an unexpected error."
          fi
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state="$STATE" \
            -f description="$DESCRIPTION" \
            -f context="release"
